{% extends 'base.html' %}
{% load static %}

{% block content %}

<!-- HERO – trendy, full-screen with gradient overlay & call to action -->
<section class="hero-premium d-flex align-items-center">
  <div class="container text-center">
    <h1 class="hero-main">DROP THE HYPE</h1>
    <p class="hero-tagline">Next-gen sneakers built for street dominance</p>

    <div class="mt-4">
      <a href="#products-section" class="btn btn-neon btn-lg px-5 py-3">
        Explore Collection →
      </a>
    </div>
  </div>
</section>

<section class="feature-strip py-4 text-center">
  <div class="container d-flex justify-content-around">
    <div>🚚 Fast Delivery</div>
    <div>🔥 Latest Drops</div>
    <div>💯 Premium Quality</div>
  </div>
</section>
<!-- SUB CATEGORY BAR – trendy pills with hover glow -->
<div class="container mt-5" data-aos="fade-up">
  <div id="sub-category-bar" class="d-flex gap-3 flex-wrap justify-content-center mb-5">
    <!-- Filled by JS – trendy buttons -->
  </div>
</div>

<!-- PRODUCTS – trendy grid with hover effects -->
<section id="products-section" class="products-section py-5">
  <div class="container">

    <h2 class="products-title">🔥 Explore Collection</h2>

    <div id="loader" class="loader mx-auto mb-5"></div>

    <div class="row g-4 d-none" id="product-list"></div>

  </div>
</section>

{% endblock %}

{% block scripts %}
<script src="{% static 'js/home.js' %}"></script>
{% endblock %}
