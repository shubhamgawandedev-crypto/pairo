{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAIRO – Step Into the Future</title>

  <!-- Google Fonts – Poppins + Bebas Neue for trendy headings -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Animate & AOS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="overflow-x-hidden">
<!-- NAVBAR – trendy glass, with neon brand & cart badge -->
<nav class="navbar navbar-expand-lg fixed-top genz-navbar px-4 py-3">
  <div class="container-fluid">

    <!-- 🔥 BRAND -->
    <a class="navbar-brand brand-logo d-flex align-items-center gap-2" href="/">
      <span class="logo-icon">👟</span>
      <span class="brand-text">PAIRO</span>
    </a>

    <!-- MOBILE TOGGLE -->
    <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      ☰
    </button>

    <!-- NAV CONTENT -->
    <div class="collapse navbar-collapse justify-content-between" id="navbarNav">

      <!-- CENTER LINKS -->
      <ul class="navbar-nav mx-auto gap-4 text-center">
        <li class="nav-item"><a class="nav-link nav-genz" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link nav-genz" href="#">Drops</a></li>
        <li class="nav-item"><a class="nav-link nav-genz" href="#">Street</a></li>
        <li class="nav-item"><a class="nav-link nav-genz" href="#">Collections</a></li>
      </ul>

      <!-- RIGHT SIDE -->
      <div class="d-flex align-items-center gap-3">

        {% if user.is_authenticated %}
          <a href="/profile/" class="nav-icon">👤</a>
          <a href="/logout/" class="nav-icon">🚪</a>
        {% else %}
          <a href="/login/" class="nav-icon">🔐</a>
        {% endif %}

        <!-- CART -->
        <a href="/cart/" class="nav-icon position-relative">
          🛒
          <span id="cart-count-badge"
            class="badge bg-danger position-absolute top-0 start-100 translate-middle d-none">
            0
          </span>
        </a>

      </div>

    </div>
  </div>
</nav>

<!-- PAGE CONTENT -->
<main class="pt-5 mt-5">
  {% block content %}{% endblock %}
</main>

<!-- TOAST – trendy, animated -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1055;">
  <div id="toast" class="toast align-items-center text-white bg-dark border-0 shadow-neon rounded-pill" role="alert">
    <div class="d-flex">
      <div class="toast-body fw-medium fs-5 px-4 py-3" id="toast-body"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- GLOBAL JS (API + TOAST) -->
<script src="{% static 'js/api.js' %}"></script>

<!-- PAGE-SPECIFIC SCRIPTS -->
{% block scripts %}{% endblock %}

<!-- AOS -->
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
  AOS.init({ once: true, duration: 1200, easing: 'ease-out-cubic' });
</script>
<script>
window.addEventListener("scroll", function() {
  const nav = document.querySelector(".genz-navbar");
  if (window.scrollY > 50) {
    nav.style.background = "rgba(0,0,0,0.9)";
  } else {
    nav.style.background = "rgba(0,0,0,0.6)";
  }
});
</script>

</body>
</html>
